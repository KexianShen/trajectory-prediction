defaults:
  - hydra: default
  - datamodule: av2
  - model: model
  - _self_

seed: 2333
monitor: val/loss
save_top_k: 2

data_root:
checkpoint:
output: ${model.name}

preprocess_num_cpus: 16
preprocess_batch_size: 50

# trainer
num_workers: 8
gpus: 1
sync_bn: false
batch_size: 8
epochs: 40
precision: bf16-mixed
warmup_epochs: 5
fast_dev_run: 0

# optimizer
lr: 0.001
weight_decay: 1e-4
gradient_clip_val: 5
gradient_clip_algorithm: norm

limit_train_batches:
limit_val_batches:
limit_test_batches:
test: false

