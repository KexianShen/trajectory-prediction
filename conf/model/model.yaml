name: trajectory-prediction

target:
  _target_: src.model.trainer.Trainer
  net:
    _target_: src.model.model.Model
    agent_dim: 4
    lane_dim: 2
    num_agent_type: 4
    num_lane_type: 1
    dim: 128
    encoder_depth: 4
    num_heads: 8
    dropout: 0.1
    norm_eps: 1e-5
    headwise_attn_output_gate: true
  optim:
    lr: ${lr}
    beta: [0.9, 0.999]
    weight_decay: ${weight_decay}
    epochs: ${epochs}
    warmup_epochs: ${warmup_epochs}
    min_lr: 1e-6
